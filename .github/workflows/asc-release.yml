name: 上架资料（App Store Connect）
on:
  push:
    branches: [main]
    paths: [ci/asc.txt]
permissions:
  contents: write
jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEY_ID: G235VJ97RJ
      ISSUER_ID: 984b2449-6ea9-47a4-8956-c836f0aa5f92
    steps:
      - uses: actions/checkout@v4
      - name: 解密 App Store Connect 密钥
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
          ASC_B64: ${{ secrets.ASC_KEY_ENC_B64 }}
        run: |
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"
          printf %s "$ASC_B64" | base64 --decode > "$RUNNER_TEMP/asc.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/asc.enc" -out "$K/AuthKey.p8" -pass env:PASS
          echo "KEY_PATH=$K/AuthKey.p8" >> $GITHUB_ENV
          if [ -f ci/review_contact.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/review_contact.enc -out "$K/contact.json" -pass env:PASS
            echo "CONTACT_PATH=$K/contact.json" >> $GITHUB_ENV
          fi
      - name: 运行
        run: |
          pip install -q pyjwt cryptography requests
          mkdir -p /tmp/asclog
          python3 ci/asc_release.py "$(head -1 ci/asc.txt)" 2>&1 | tee /tmp/asclog/out.txt
      - name: 保存日志
        if: always()
        run: |
          mkdir -p /tmp/asclog && cd /tmp/asclog
          echo "$GITHUB_SHA" > sha.txt
          git init -q -b ci-log-asc; git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "asc $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log-asc
