name: DailyReview
options:
  bundleIdPrefix: site.xiaomanhabit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: FUWHR5TSWG       # Apple 开发者团队 ID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  DailyReview:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小满记
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchPaper
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: site.xiaomanhabit.app
            CFBundleURLSchemes: [xiaoman]
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 用面容 ID 解锁小满，保护你的打卡和笔记
        NSPhotoLibraryUsageDescription: 选择照片作为头像或习惯图标
        NSCameraUsageDescription: 拍照作为头像或习惯图标
        UIAppFonts:
          - xm_kose.ttf
          - xm_kuaile.ttf
          - xm_butter.ttf
          - xm_kai.ttf
          - xm_pixel.ttf
          - xm_round.ttf
    entitlements:
      path: App/DailyReview.entitlements
      properties:
        com.apple.security.application-groups:
          - group.site.xiaomanhabit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.xiaomanhabit.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Xiaoman AppStore site.xiaomanhabit.app
    dependencies:
      - target: DailyReviewWidget
    scheme:
      testTargets: [DailyReviewTests, DailyReviewUITests]
  DailyReviewWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 小满记
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DailyReviewWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.site.xiaomanhabit.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.xiaomanhabit.app.widget
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Xiaoman AppStore site.xiaomanhabit.app.widget
  DailyReviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DailyReview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: site.xiaomanhabit.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DailyReview.app/DailyReview
        BUNDLE_LOADER: $(TEST_HOST)
  DailyReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: Tests/ProductsCN.storekit
      - path: Tests/ProductsUS.storekit
    dependencies:
      - target: DailyReview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: site.xiaomanhabit.app.uitests
        TEST_TARGET_NAME: DailyReview
